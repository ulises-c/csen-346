[project]
name = "csen-346"
version = "0.1.0"
description = "Natural Language Processing - CSEN 346 SCU. Hugging Face and other resources"
authors = [{ name = "Ulises Chavarria", email = "ulises.engineer@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.41.1,<3.0.0",
    "transformers>=5.9.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "huggingface-hub>=1.19.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "tqdm>=4.68.2",
    "rich>=13.9.0",
    "datasets>=3.2.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.15.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "google-genai>=2.8.0",
    "peft>=0.19.1",
    "trl>=1.6.0",
    "tiktoken>=0.7.0",
    "pyspellchecker>=0.9.0",
]

[project.optional-dependencies]
# Experiment tracking for the state-classifier training scripts. Optional so the
# core install and the no-tracking code path stay dependency-free; opt in with
# `uv sync --extra wandb` (or `pip install -e ".[wandb]"`).
wandb = ["wandb>=0.27.2"]

# CUDA-only training acceleration. flash-linear-attention engages Qwen3.5's
# Triton gated-delta-rule kernels (~2.8x fwd+bwd over the pure-PyTorch fallback;
# the 18 GDN layers are 75% of the model). Opt in on NVIDIA with
# `uv sync --extra cuda`. NOT a core dep on purpose: ROCm torch reports
# torch.cuda.is_available()==True, so if `fla` is merely installed on the AMD
# gfx1201 box, transformers routes GDN through FLA's Triton kernels — which need
# the issue #100 gfx1201 patch and otherwise page-fault. Keeping it CUDA-opt-in
# means the AMD path keeps its known-good pure-PyTorch fallback. causal-conv1d is
# intentionally excluded (only fuses the cheap conv; needs nvcc to build).
cuda = ["flash-linear-attention>=0.5.0"]

# Web UI for the live demo. Install with `uv sync --extra demo`.
demo = ["chainlit>=2.4,<3"]

[project.scripts]
kele = "src.project.kele:main"
kele-eval = "src.project.evaluate:main"
serve-teacher = "src.project.serve_teacher:main"
tournament = "src.project.tournament:main"
test = "src.project.scripts:test"
lint = "src.project.scripts:lint"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -ra"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/project/translate_dataset.py",  # translation script; not unit-testable in CI
    "src/project/demo/build_public_assets.py",  # PIL asset generator; not unit-testable in CI
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["src"]
exclude = ["references/"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pyright>=1.1.0",
    "ruff>=0.15.16",
    "codespell>=2.3.0",
    "matplotlib>=3.10.9",
]

[tool.codespell]
# Skip generated/external files and non-English content.
# codespell uses fnmatch, so directory skips need a wildcard prefix.
# Binary image formats (PDF/PNG/JPG) match false positives against compressed
# byte sequences inside the file streams; runtime logs are noise. Skip them
# outright — none are human-edited source content.
skip = "uv.lock,*references*,*deliverables*,*results*,.venv,*data*,*logs*,*.pdf,*.png,*.jpg,*.jpeg,*.gif"
# Terms that are not typos:
#   rouge   — ROUGE (NLP metric: Recall-Oriented Understudy for Gisting Evaluation)
#   nothink — Qwen model inference mode flag (think / nothink)
#   re-use  — hyphenated form is valid; codespell prefers the unhyphenated reuse
ignore-words-list = "rouge,nothink,re-use,hsa"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["references/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501", # line too long — ruff format handles this
]

[tool.ruff.lint.per-file-ignores]
# Test files stub out optional deps with sys.modules patches before importing, so
# E402 (import not at top) and F401 (unused imports) are intentional.
"tests/*" = ["F401", "E402"]
# Trailing spaces in the CN file are intentional markdown line-break syntax (  \n)
# inside the system-prompt string.
"references/KELE/original_CN/*" = ["W291"]

# ---------------------------------------------------------------------------
# NOTE: torch is intentionally NOT declared here.
# triton-rocm (a dep of the ROCm wheel) is not on PyPI, so uv's resolver
# cannot satisfy it as a direct-URL dep. Install torch AFTER `uv sync`
# with the hardware-appropriate command below, then use `uv run --no-sync`
# (or set UV_NO_SYNC=1) so uv does not revert to the PyPI CUDA wheel.
#
# NVIDIA (CUDA 12.6):
#   uv pip install --index-url https://download.pytorch.org/whl/cu126 "torch>=2.10.0"
#
# AMD ROCm 7.2 (gfx1201 / R9700 AI PRO — natively supported, no HSA override):
#   uv pip install --index-url https://download.pytorch.org/whl/rocm7.2 "torch==2.11.0+rocm7.2"
# ---------------------------------------------------------------------------
