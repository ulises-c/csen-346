[project]
name = "csen-346"
version = "0.1.0"
description = "Natural Language Processing - CSEN 346 SCU. Hugging Face and other resources"
authors = [{ name = "Ulises Chavarria", email = "ulises.engineer@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.38.0,<3.0.0",
    "transformers>=5.9.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "huggingface-hub>=1.16.1",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "tqdm>=4.67.0",
    "rich>=13.9.0",
    "datasets>=3.2.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.47.0",
    "pydantic>=2.13.4",
    "google-genai>=2.6.0",
    "peft>=0.19.1",
    "trl>=1.4.0",
    "tiktoken>=0.7.0",
    "pyspellchecker>=0.9.0",
]

[project.scripts]
kele = "src.project.kele:main"
kele-eval = "src.project.evaluate:main"
serve-teacher = "src.project.serve_teacher:main"
tournament = "src.project.tournament:main"
test = "src.project.scripts:test"
lint = "src.project.scripts:lint"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -ra"

[tool.coverage.run]
source = ["src"]
omit = ["src/project/translate_dataset.py"]  # translation script; not unit-testable in CI

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["src"]
exclude = ["references/"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pyright>=1.1.0",
    "ruff>=0.15.14",
    "codespell>=2.3.0",
    "matplotlib>=3.10.9",
]

[tool.codespell]
# Skip generated/external files and non-English content.
# codespell uses fnmatch, so directory skips need a wildcard prefix.
# Binary image formats (PDF/PNG/JPG) match false positives against compressed
# byte sequences inside the file streams; runtime logs are noise. Skip them
# outright — none are human-edited source content.
skip = "uv.lock,*references*,*deliverables*,*results*,.venv,*data*,*logs*,*.pdf,*.png,*.jpg,*.jpeg,*.gif"
# Terms that are not typos:
#   rouge   — ROUGE (NLP metric: Recall-Oriented Understudy for Gisting Evaluation)
#   nothink — Qwen model inference mode flag (think / nothink)
#   re-use  — hyphenated form is valid; codespell prefers the unhyphenated reuse
ignore-words-list = "rouge,nothink,re-use"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["references/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501", # line too long — ruff format handles this
]

[tool.ruff.lint.per-file-ignores]
# Test files stub out optional deps with sys.modules patches before importing, so
# E402 (import not at top) and F401 (unused imports) are intentional.
"tests/*" = ["F401", "E402"]
# Trailing spaces in the CN file are intentional markdown line-break syntax (  \n)
# inside the system-prompt string.
"references/KELE/original_CN/*" = ["W291"]

# ---------------------------------------------------------------------------
# NOTE: torch is intentionally NOT declared here.
# uv cannot resolve the +cu126 local-version CUDA wheel alongside
# PyPI's CPU wheel (transitive dep from transformers) for Python 3.14.
# Install torch after `uv sync` with:
#   uv run pip install --index-url https://download.pytorch.org/whl/cu126 \
#     "torch>=2.10.0"
# See scripts/*_SETUP.md for the full install sequence for your hardware.
# ---------------------------------------------------------------------------
